<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福瑞专属 AI 站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SF Pro Display", "Microsoft YaHei", sans-serif;
            transition: all 0.3s ease;
        }
        /* 浅色模式：柔和渐变背景 */
        :root[data-theme="light"] {
            --bg: linear-gradient(135deg, #f8fbff 0%, #e0eaff 100%);
            --glass: rgba(255,255,255,0.25);
            --glass-border: rgba(255,255,255,0.4);
            --text: #1a1a1a;
            --subtext: #444;
            --card: rgba(255,255,255,0.45);
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        /* 深色模式：高级渐变背景 */
        :root[data-theme="dark"] {
            --bg: linear-gradient(135deg, #111827 0%, #1f2937 50%, #0f172a 100%);
            --glass: rgba(20,20,30,0.4);
            --glass-border: rgba(255,255,255,0.1);
            --text: #f0f0f0;
            --subtext: #bbb;
            --card: rgba(30,30,45,0.55);
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }
        nav {
            position: sticky; top: 12px;
            width: 96%; max-width: 1200px;
            margin: 12px auto;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 22px;
            z-index: 999;
        }
        .nav-logo {
            font-weight: 700; font-size: 18px;
        }
        .nav-links {
            display: flex; gap: 24px;
        }
        .nav-links button {
            background: transparent; border: 0;
            color: var(--text); font-size: 15px; cursor: pointer;
        }
        .nav-links button.active {
            font-weight: 600;
            padding: 6px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .theme-btn {
            padding: 8px 14px; border-radius: 10px; border: 0; cursor: pointer;
            background: rgba(255,255,255,0.2); color: var(--text);
        }
        main {
            width: 96%; max-width: 1200px; margin: 20px auto;
            display: flex; flex-direction: column; gap: 18px;
        }
        .page { display: none; }
        .page.active { display: block; }
        .hero {
            padding: 26px; min-height: 220px;
        }
        .hero h1 {
            font-size: 26px; margin-bottom: 10px;
        }
        .gallery {
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .grid-item {
            aspect-ratio: 16/10; border-radius: 14px;
            background: rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            color: var(--subtext); font-size: 13px;
            overflow: hidden;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
        .ai-chat {
            height: 520px; padding: 18px; display: flex; flex-direction: column;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg {
            max-width: 75%; padding: 10px 14px; border-radius: 14px;
        }
        .msg.user {
            align-self: flex-end; background: rgba(120,120,255,0.3);
        }
        .msg.bot {
            align-self: flex-start; background: rgba(255,255,255,0.2);
        }
        .chat-input {
            display: flex; gap: 10px; margin-top: 10px;
        }
        .chat-input input {
            flex: 1; padding: 12px 14px; border-radius: 12px; border: 0;
            background: rgba(255,255,255,0.2); color: var(--text);
            outline: none;
        }
        .chat-input button {
            padding: 12px 18px; border-radius: 12px; border: 0; cursor: pointer;
            background: #6ea8ff; color: white;
        }
        .auth-card {
            width: 100%; max-width: 420px; margin: 10px auto;
            padding: 24px; display: flex; flex-direction: column; gap: 14px;
        }
        .auth-card input {
            padding: 12px; border-radius: 10px; border: 0;
            background: rgba(255,255,255,0.2); color: var(--text); outline: none;
        }
        .captcha {
            padding: 10px; border-radius: 10px; text-align: center;
            background: rgba(0,0,0,0.15);
        }
        .auth-btn {
            padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
            background: #58b4ff; color: white; font-weight: 600;
        }
        .tab-row {
            display: flex; gap: 10px; margin-bottom: 6px;
        }
        .tab-row button {
            flex: 1; padding: 10px; border: 0; border-radius: 10px; cursor: pointer;
            background: transparent; color: var(--text);
        }
        .tab-row button.active {
            background: rgba(255,255,255,0.25);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="glass">
        <div class="nav-logo">福瑞专属空间</div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="home">主页</button>
            <button class="nav-btn" data-target="ai">AI助手</button>
            <button class="nav-btn" data-target="profile">我的</button>
        </div>
        <button class="theme-btn" id="themeToggle">深浅模式</button>
    </nav>
    <main>
        <!-- 主页 -->
        <section class="page active" id="home">
            <div class="hero glass">
                <h1>欢迎来到福瑞专属主页</h1>
                <p style="color:var(--subtext)">液态玻璃风格 · 流畅体验 · AI 内置</p >
            </div>
            <div class="gallery glass">
                <h3 style="margin-bottom:14px">福瑞图片展示区</h3>
                <div class="grid">
                    <div class="grid-item"><img src="furry1.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry2.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry3.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry4.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry5.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry6.jpg" alt=""></div>
                </div>
            </div>
        </section>
        <!-- AI助手 -->
        <section class="page" id="ai">
            <div class="ai-chat glass">
                <h3>AI 助手（Qwen3-8B）</h3>
                <div class="chat-messages" id="messages"></div>
                <div class="chat-input">
                    <input id="userInput" placeholder="输入消息...">
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>
        </section>
        <!-- 我的（登录注册） -->
        <section class="page" id="profile">
            <div class="auth-card glass">
                <div class="tab-row">
                    <button class="auth-tab active" data-tab="login">登录</button>
                    <button class="auth-tab" data-tab="register">注册</button>
                </div>
                <!-- 登录 -->
                <div class="auth-form active" id="loginForm">
                    <input placeholder="账号">
                    <input type="password" placeholder="密码">
                    <div class="captcha">人机验证区域</div>
                    <button class="auth-btn">登录</button>
                </div>
                <!-- 注册 -->
                <div class="auth-form" id="registerForm" style="display:none;">
                    <input placeholder="用户名">
                    <input placeholder="账号">
                    <input type="password" placeholder="密码">
                    <div class="captcha">人机验证区域</div>
                    <button class="auth-btn">注册</button>
                </div>
            </div>
        </section>
    </main>
    <script>
        const root = document.documentElement;
        const saved = localStorage.getItem("theme") || "dark";
        root.setAttribute("data-theme", saved);
        document.getElementById("themeToggle").onclick = () => {
            const now = root.getAttribute("data-theme");
            const next = now === "light"? "dark" : "light";
            root.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        };
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                const target = btn.dataset.target;
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                document.getElementById(target).classList.add("active");
            };
        });
        document.querySelectorAll(".auth-tab").forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                const t = tab.dataset.tab;
                document.getElementById("loginForm").style.display = t === "login"? "block" : "none";
                document.getElementById("registerForm").style.display = t === "register"? "block" : "none";
            };
        });

        // ========== 硅基流动配置（你的Key+纯8B模型） ==========
        const API_KEY = "sk-notxpaduknxfetcjomcskyuxsitcbxxojnousrcunoipjqxt";
        const API_URL = "https://api.siliconflow.cn/v1/chat/completions";
        const MODEL = "Qwen/Qwen3-8B";
        // ==================================================

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;
            const messages = document.getElementById("messages");
            
            const userMsg = document.createElement("div");
            userMsg.className = "msg user";
            userMsg.textContent = text;
            messages.appendChild(userMsg);
            input.value = "";
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [{ role: "user", content: text }],
                        stream: false
                    })
                });

                if (!res.ok) throw new Error(`请求失败: ${res.status}`);
                const data = await res.json();
                const aiText = data.choices[0].message.content || "暂无回复";

                const botMsg = document.createElement("div");
                botMsg.className = "msg bot";
                botMsg.textContent = aiText;
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            } catch(e) {
                console.error("错误详情:", e);
                const errMsg = document.createElement("div");
                errMsg.className = "msg bot";
                errMsg.textContent = `AI 请求失败: ${e.message}`;
                messages.appendChild(errMsg);
            }
        }

        document.getElementById("userInput").addEventListener("keydown", e => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>

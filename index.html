<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福瑞专属 AI 站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SF Pro Display", "Microsoft YaHei", sans-serif;
            transition: all 0.3s ease;
        }
        :root[data-theme="light"] {
            --bg: linear-gradient(135deg, #f8fbff 0%, #e0eaff 100%);
            --glass: rgba(255,255,255,0.25);
            --glass-border: rgba(255,255,255,0.4);
            --text: #1a1a1a;
            --subtext: #444;
            --card: rgba(255,255,255,0.45);
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        :root[data-theme="dark"] {
            --bg: linear-gradient(135deg, #111827 0%, #1f2937 50%, #0f172a 100%);
            --glass: rgba(20,20,30,0.4);
            --glass-border: rgba(255,255,255,0.1);
            --text: #f0f0f0;
            --subtext: #bbb;
            --card: rgba(30,30,45,0.55);
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }
        nav {
            position: sticky; top: 12px;
            width: 96%; max-width: 1200px;
            margin: 12px auto;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 22px;
            z-index: 999;
        }
        .nav-logo {
            font-weight: 700; font-size: 18px;
        }
        .nav-links {
            display: flex; gap: 24px;
        }
        .nav-links button {
            background: transparent; border: 0;
            color: var(--text); font-size: 15px; cursor: pointer;
            padding: 6px 12px; border-radius: 10px;
        }
        .nav-links button.active {
            font-weight: 600;
            background: rgba(255,255,255,0.2);
        }
        .theme-btn {
            padding: 8px 14px; border-radius: 10px; border: 0; cursor: pointer;
            background: rgba(255,255,255,0.2); color: var(--text);
        }
        main {
            width: 96%; max-width: 1200px; margin: 20px auto;
            display: flex; flex-direction: column; gap: 18px;
        }
        .page { display: none; }
        .page.active { display: block; }
        .hero {
            padding: 26px; min-height: 220px;
        }
        .hero h1 {
            font-size: 26px; margin-bottom: 10px;
        }
        .gallery {
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .grid-item {
            aspect-ratio: 16/10; border-radius: 14px;
            background: rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            color: var(--subtext); font-size: 13px;
            overflow: hidden;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
        .ai-chat {
            height: 520px; padding: 18px; display: flex; flex-direction: column;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg {
            max-width: 75%; padding: 10px 14px; border-radius: 14px;
        }
        .msg.user {
            align-self: flex-end; background: rgba(120,120,255,0.3);
        }
        .msg.bot {
            align-self: flex-start; background: rgba(255,255,255,0.2);
        }
        .chat-input {
            display: flex; gap: 10px; margin-top: 10px;
        }
        .chat-input input {
            flex: 1; padding: 12px 14px; border-radius: 12px; border: 0;
            background: rgba(255,255,255,0.2); color: var(--text);
            outline: none;
        }
        .chat-input button {
            padding: 12px 18px; border-radius: 12px; border: 0; cursor: pointer;
            background: #6ea8ff; color: white;
        }

        /* 登录页面仿HBS样式 */
        .login-card {
            width: 100%; max-width: 420px; margin: 40px auto;
            padding: 30px 24px; display: flex; flex-direction: column;
            text-align: center; gap:16px;
        }
        .login-card h2 {
            margin-bottom: 10px;
        }
        .login-card input {
            padding: 12px; border-radius: 10px; border: 0;
            background: rgba(255,255,255,0.2); color: var(--text);
            outline: none;
            font-size: 15px;
        }
        .login-btn {
            padding: 12px; border-radius: 10px; border: 0;
            background: #58b4ff; color: white;
            font-weight: 600; cursor: pointer;
            font-size: 15px;
        }

        /* 关于页面 */
        .about-card {
            width: 100%; max-width: 420px; margin: 40px auto;
            padding: 30px 24px; text-align: center;
        }
        .version-text {
            font-size: 20px;
            font-weight: 600;
            margin: 20px 0;
            cursor: pointer;
        }
        .time-text {
            color: var(--subtext);
            margin-bottom: 30px;
        }
        .about-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 0;
            margin: 8px 0;
            cursor: pointer;
            font-size: 15px;
        }
        .logout-btn {
            background: rgba(100,180,255,0.25);
            color: var(--text);
        }
        .del-btn {
            background: rgba(255,100,100,0.25);
            color: #ff6b6b;
        }

        /* 管理员弹窗 */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-box {
            background: #1f2937;
            padding: 25px;
            border-radius: 14px;
            width: 90%; max-width: 350px;
        }
        .modal-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 0;
            background: rgba(255,255,255,0.15);
            color: #fff;
            outline: none;
        }
        .modal-box button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 0;
            background: #58b4ff;
            color: white;
            cursor: pointer;
        }
        /* 源代码弹窗 */
        .code-modal {
            position: fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:#000;
            z-index:10000;
            display:none;
            padding:20px;
        }
        .code-modal pre {
            color:#ccc;
            font-size:12px;
            white-space:pre-wrap;
            word-break:break-all;
            height:100%;
            overflow:auto;
        }
        .close-code {
            position:absolute;
            top:10px;right:20px;
            color:#fff;
            font-size:24px;
            cursor:pointer;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="glass">
        <div class="nav-logo">福瑞专属空间</div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="home">主页</button>
            <button class="nav-btn" data-target="ai">AI助手</button>
            <button class="nav-btn" data-target="profile">我的</button>
            <button class="nav-btn" data-target="about">关于</button>
        </div>
        <button class="theme-btn" id="themeToggle">深浅模式</button>
    </nav>

    <main>
        <!-- 主页 -->
        <section class="page active" id="home">
            <div class="hero glass">
                <h1>欢迎来到福瑞专属主页</h1>
                <p style="color:var(--subtext)">液态玻璃风格 · 流畅体验 · AI 内置</p>
            </div>
            <div class="gallery glass">
                <h3 style="margin-bottom:14px">福瑞图片展示区</h3>
                <div class="grid">
                    <div class="grid-item"><img src="furry1.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry2.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry3.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry4.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry5.jpg" alt=""></div>
                    <div class="grid-item"><img src="furry6.jpg" alt=""></div>
                </div>
            </div>
        </section>

        <!-- AI助手 -->
        <section class="page" id="ai">
            <div class="ai-chat glass">
                <h3>AI 助手（Qwen3-8B）</h3>
                <div class="chat-messages" id="messages"></div>
                <div class="chat-input">
                    <input id="userInput" placeholder="输入消息...">
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>
        </section>

        <!-- 我的 仿HBS登录 -->
        <section class="page" id="profile">
            <div class="login-card glass">
                <h2>账号登录</h2>
                <input id="accInput" placeholder="请输入账号">
                <input id="pwdInput" type="password" placeholder="请输入密码">
                <button class="login-btn" onclick="localLogin()">立即登录</button>
            </div>
        </section>

        <!-- 关于页面 -->
        <section class="page" id="about">
            <div class="about-card glass">
                <h2>关于本应用</h2>
                <div class="version-text" id="versionClick">1.0.7beta5</div>
                <div class="time-text">发布时间：2026年5月2日 19点17分31秒</div>
                <button class="about-btn logout-btn" onclick="logoutSys()">退出登录</button>
                <button class="about-btn del-btn" onclick="delAccount()">注销账号</button>
            </div>
        </section>
    </main>

    <!-- 管理员登录弹窗 -->
    <div class="modal" id="secretModal">
        <div class="modal-box">
            <h3 style="color:#fff;margin-bottom:15px;text-align:center;">管理员验证</h3>
            <input id="secAcc" placeholder="管理员账号">
            <input id="secPwd" type="password" placeholder="管理员密码">
            <button onclick="checkSecret()">确认验证</button>
        </div>
    </div>

    <!-- 查看源代码弹窗 -->
    <div class="code-modal" id="codeModal">
        <span class="close-code" onclick="closeCodeView()">×</span>
        <pre id="codeContent"></pre>
    </div>

    <script>
        // 你的新API Key
        const API_KEY = "sk-zsribjbgavtseqnqhvuwwoqunkygtkyojawqhffxyfrzpvkl";
        const API_URL = "https://api.siliconflow.cn/v1/chat/completions";
        const MODEL = "Qwen/Qwen3-8B";

        // 深浅模式
        const root = document.documentElement;
        const saved = localStorage.getItem("theme") || "dark";
        root.setAttribute("data-theme", saved);
        document.getElementById("themeToggle").onclick = () => {
            const now = root.getAttribute("data-theme");
            const next = now === "light"? "dark" : "light";
            root.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        };

        // 页面切换
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                const target = btn.dataset.target;
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                document.getElementById(target).classList.add("active");
            };
        });

        // 本地登录
        function localLogin(){
            let acc = document.getElementById("accInput").value.trim();
            let pwd = document.getElementById("pwdInput").value.trim();
            if(!acc || !pwd){
                alert("请输入账号和密码");
                return;
            }
            localStorage.setItem("localAcc",acc);
            localStorage.setItem("localPwd",pwd);
            alert("登录成功");
        }
        // 退出
        function logoutSys(){
            localStorage.removeItem("localAcc");
            localStorage.removeItem("localPwd");
            alert("已退出登录");
        }
        // 注销
        function delAccount(){
            if(confirm("确定注销账号？将清空所有本地数据！")){
                localStorage.clear();
                alert("账号已注销");
            }
        }

        // 版本号连击5次
        let clickCount = 0;
        const verEle = document.getElementById("versionClick");
        verEle.onclick = function(){
            clickCount++;
            if(clickCount >= 5){
                clickCount = 0;
                document.getElementById("secretModal").style.display = "flex";
            }
            setTimeout(()=>clickCount=0,1500);
        };

        // 管理员验证，成功直接看完整源码（不遮挡任何内容）
        function checkSecret(){
            let a = document.getElementById("secAcc").value.trim();
            let p = document.getElementById("secPwd").value.trim();
            if(a === "阿兰是只喵" && p === "9657261"){
                document.getElementById("secretModal").style.display = "none";
                // 直接获取原生完整源码，不做任何替换隐藏
                let source = document.documentElement.outerHTML;
                document.getElementById("codeContent").textContent = source;
                document.getElementById("codeModal").style.display = "block";
            }else{
                alert("账号或密码错误");
            }
        }
        // 关闭源码查看
        function closeCodeView(){
            document.getElementById("codeModal").style.display = "none";
        }

        // 规范版AI聊天请求（解决403问题）
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;
            const messages = document.getElementById("messages");

            // 添加用户消息
            const userMsg = document.createElement("div");
            userMsg.className = "msg user";
            userMsg.textContent = text;
            messages.appendChild(userMsg);
            input.value = "";
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [{ role: "user", content: text }]
                    })
                });

                if (!res.ok) {
                    throw new Error(`请求失败: ${res.status}`);
                }

                const data = await res.json();
                const aiText = data.choices[0].message.content || "暂无回复";

                const botMsg = document.createElement("div");
                botMsg.className = "msg bot";
                botMsg.textContent = aiText;
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            } catch (e) {
                console.error("错误详情:", e);
                const errMsg = document.createElement("div");
                errMsg.className = "msg bot";
                errMsg.textContent = `AI 请求失败: ${e.message}`;
                messages.appendChild(errMsg);
            }
        }
        document.getElementById("userInput").addEventListener("keydown", e => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
